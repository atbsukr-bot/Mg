<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:TJ;src:url(Tajawal-Black.ttf)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.st{position:absolute;inset:0;background:url(bg.jpg) center/cover}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 40%,rgba(227,38,42,.45),transparent 45%),radial-gradient(circle at 10% 90%,rgba(20,120,170,.35),transparent 50%)}
.p{position:absolute;left:var(--l);top:var(--t);width:var(--w);filter:saturate(1.12) contrast(1.08) brightness(1.08) drop-shadow(0 0 18px rgba(227,38,42,.75)) drop-shadow(0 0 4px rgba(255,80,80,.6))}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 45%,transparent 50%,rgba(0,0,0,.75))}
.t{position:absolute;left:0px;top:70px;width:640px;direction:rtl;text-align:center;font-family:TJ;line-height:1.02;transform:rotate(-4deg)}
.t div{white-space:nowrap;font-size:var(--fs);-webkit-text-stroke:5px #3a0610;paint-order:stroke fill;
 text-shadow:0 1px 0 #5a0a14,0 2px 0 #5a0a14,0 3px 0 #5a0a14,0 4px 0 #5a0a14,0 5px 0 #5a0a14,0 6px 0 #5a0a14,0 7px 0 #5a0a14,0 8px 0 #5a0a14,0 9px 0 #5a0a14,0 10px 0 #5a0a14,0 11px 0 #5a0a14,0 18px 30px rgba(0,0,0,.8)}
.l1{color:#FFD23F}.l2{color:#fff}
.tag{position:absolute;left:90px;top:var(--tt);direction:rtl;font-family:TJ;font-size:44px;color:#fff;background:#7A1022;border:4px solid #fff;padding:6px 26px 2px;transform:rotate(-4deg);box-shadow:0 8px 20px rgba(0,0,0,.6)}
.ph{position:absolute;left:40px;bottom:30px;width:230px;border:8px solid #f1ead8;transform:rotate(6deg);box-shadow:0 10px 24px rgba(0,0,0,.7);filter:grayscale(.3) contrast(1.1)}
.tape{position:absolute;left:115px;bottom:168px;width:90px;height:28px;background:rgba(240,225,170,.75);transform:rotate(-8deg)}
.logo{position:absolute;right:24px;bottom:22px;width:86px}
</style></head><body>
<div class="st"></div><div class="glow"></div>
<img class="p" src="person.png" style="--l:VAR_L;--t:VAR_T;--w:VAR_W">
<div class="vig"></div>
<div class="t" style="--fs:VAR_FS"><div class="l1">L1</div><div class="l2">L2</div></div>
<div class="tag" style="--tt:VAR_TT">TAG</div>
<img class="ph" src="phone.jpg"><div class="tape"></div>
<img class="logo" src="logo.png">
</body></html>
