 filter:drop-shadow(0 2px 0 #4a2a0c) drop-shadow(0 3px 0 #3a200a) drop-shadow(0 4px 0 #2e1806) drop-shadow(0 6px 0 #241204) drop-shadow(0 16px 22px rgba(0,0,0,.9))}
